env:
  id: LunarLander-v3

training:
  episodes: 1000
  max_steps_per_episode: 1000
  seed: 42
  log_every: 10
  update_every: 1

checkpoint:
  enabled: true
  directory: checkpoints
  frequency: 50
  save_best: true

wandb:
  enabled: true
  project: "rl-lunar-lander"
  name: baseline
  tags: ["baseline", "dqn"]

reward_shaping:
  enabled: false

optimize:
  enabled: true
  n_trials: 50
  direction: "maximize"
  study_name: "lunar-lander-tuning"

agent_config: agents/dqn.yaml
