agent:
  name: reinforce
  seed: 42
  reinforce:
    learning_rate: 0.001
    gamma: 0.99
    hidden_dim: 256
    hidden_layers: [256, 256]
    activation: leaky_relu
    weight_init: xavier
    normalization: layer
    normalization_position: before_activation
    dropout: 0.0
    batch_episodes: 4
    gradient_clip_max_norm: 1.0