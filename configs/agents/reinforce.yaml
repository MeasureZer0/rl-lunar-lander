agent:
  name: reinforce
  seed: 42
  reinforce:
    learning_rate: 1e-4
    gamma: 0.99
    hidden_dim: 128
    hidden_layers: [128, 128]
    activation: relu
    weight_init: he
    normalization: null
    normalization_position: before_activation
    dropout: 0.0
    batch_episodes: 4
    gradient_clip_max_norm: null
