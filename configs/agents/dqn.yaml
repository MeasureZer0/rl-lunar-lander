agent:
  name: dqn
  seed: 42
  dqn:
    learning_rate: 1e-3
    gamma: 0.99
    hidden_dim: 128
    hidden_layers: [128, 128]
    activation: relu
    weight_init: he
    normalization: null
    normalization_position: before_activation
    dropout: 0.0
    buffer_capacity: 50000
    batch_size: 64
    target_update_frequency: 100
    target_update_type: hard
    tau: 0.005
    epsilon_start: 1.0
    epsilon_end: 0.01
    epsilon_decay: 0.995
    epsilon_schedule: exponential
    epsilon_decay_episodes: 300
    min_buffer_size: 1000
    lr_scheduler: null
    step_lr_step_size: 100
    step_lr_gamma: 0.9
    reduce_lr_patience: 20
    gradient_clip_max_norm: null
