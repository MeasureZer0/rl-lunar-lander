agent:
  name: double_dqn
  seed: 42
  double_dqn:
    learning_rate: 0.0005
    gamma: 0.99
    hidden_dim: 256
    hidden_layers: [256, 256]
    activation: relu
    weight_init: he
    normalization: layer
    normalization_position: before_activation
    dropout: 0.0
    buffer_capacity: 50000
    batch_size: 128
    target_update_frequency: 2000
    target_update_type: hard
    tau: 0.005
    epsilon_start: 1.0
    epsilon_end: 0.01
    epsilon_decay: 0.9995
    epsilon_schedule: cosine
    epsilon_decay_episodes: 10000
    min_buffer_size: 1000
    train_frequency_steps: 1
    gradient_updates_per_step: 1
    lr_scheduler: null
    step_lr_step_size: 100
    step_lr_gamma: 0.9
    reduce_lr_patience: 20
    gradient_clip_max_norm: 1.0