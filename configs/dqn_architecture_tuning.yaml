env:
  id: LunarLander-v3
  render_mode: null

training:
  episodes: 400
  max_steps_per_episode: 1000
  seed: 123
  log_every: 10
  update_every: 1

evaluation:
  enabled: true
  episodes: 5
  frequency: 25
  render_mode: null

checkpoint:
  enabled: false
  directory: checkpoints
  frequency: 50
  save_best: true

wandb:
  enabled: true
  project: "rl-lunar-lander"
  name: dqn-architecture-tuning
  tags: ["dqn", "optuna", "architecture"]

reward_shaping:
  enabled: true
  w_align: 0.07006485891832512
  w_tilt: 0.3350465201228257
  w_soft: 0.022003662857177284
  w_hover: 0.1327158214289545
  w_leg_sym: 0.11276458767632049

optimize:
  enabled: true
  mode: architecture
  n_trials: 30
  direction: maximize
  study_name: lunar-lander-dqn-architecture
  storage: "sqlite:///optuna_studies/lunar-lander-dqn-architecture.db"
  checkpoint_directory: checkpoints
  baseline_v3_filename: baseline_v3.pt

agent_config: agents/dqn.yaml