env:
  id: LunarLander-v3
  render_mode: null

training:
  episodes: 400
  max_steps_per_episode: 1000
  seed: 123
  log_every: 10
  update_every: 1

evaluation:
  enabled: true
  episodes: 5
  frequency: 25
  render_mode: null

checkpoint:
  enabled: false
  directory: checkpoints
  frequency: 50
  save_best: true

wandb:
  enabled: true
  project: "rl-lunar-lander"
  name: double-dqn-hyperparameter-tuning
  tags: ["double_dqn", "optuna", "hyperparameters"]

reward_shaping:
  enabled: true

optimize:
  enabled: true
  mode: hyperparameters
  n_trials: 25
  direction: maximize
  study_name: lunar-lander-double-dqn-hyperparameters
  storage: "sqlite:///optuna_studies/lunar-lander-double-dqn-hyperparameters.db"
  checkpoint_directory: checkpoints
  baseline_v2_filename: double_dqn_baseline_v2.pt

agent_config: agents/double_dqn.yaml