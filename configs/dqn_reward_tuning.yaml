env:
  id: LunarLander-v3
  render_mode: null

training:
  episodes: 400
  max_steps_per_episode: 1000
  seed: 123
  log_every: 10
  update_every: 1

evaluation:
  enabled: true
  episodes: 5
  frequency: 25
  render_mode: null

checkpoint:
  enabled: false
  directory: checkpoints
  frequency: 50
  save_best: true

wandb:
  enabled: true
  project: "rl-lunar-lander"
  name: dqn-reward-shaping-tuning
  tags: ["dqn", "optuna", "reward_shaping"]

reward_shaping:
  enabled: true

optimize:
  enabled: true
  mode: reward_shaping
  n_trials: 25
  direction: maximize
  study_name: lunar-lander-dqn-reward-shaping
  storage: "sqlite:///optuna_studies/lunar-lander-dqn-reward-shaping.db"
  checkpoint_directory: checkpoints
  baseline_v4_filename: dqn_baseline_v4.pt


agent_config: agents/dqn.yaml