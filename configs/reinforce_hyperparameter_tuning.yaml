env:
  id: LunarLander-v3
  render_mode: null

training:
  episodes: 400
  max_steps_per_episode: 1000
  seed: 123
  log_every: 10
  update_every: 1

evaluation:
  enabled: true
  episodes: 5
  frequency: 25
  render_mode: null

checkpoint:
  enabled: false
  directory: checkpoints
  frequency: 50
  save_best: true

wandb:
  enabled: true
  project: "rl-lunar-lander"
  name: reinforce-hyperparameter-tuning
  tags: ["reinforce", "optuna", "hyperparameters"]

reward_shaping:
  enabled: true
  w_align: 0.31824157428105593
  w_tilt: 0.36041317570103154
  w_soft: 0.34830828480430553
  w_hover: 0.08615194107928856
  w_leg_sym: 0.1498937016402889

optimize:
  enabled: true
  mode: hyperparameters
  n_trials: 25
  direction: maximize
  study_name: lunar-lander-reinforce-hyperparameters
  storage: "sqlite:///optuna_studies/lunar-lander-reinforce-hyperparameters.db"
  checkpoint_directory: checkpoints
  baseline_v2_filename: reinforce_baseline_v2.pt

agent_config: agents/reinforce.yaml