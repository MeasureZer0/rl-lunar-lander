env:
  id: LunarLander-v3
  render_mode: null

training:
  episodes: 1000
  max_steps_per_episode: 1000
  seed: 123
  log_every: 1000
  update_every: 1

evaluation:
  enabled: true
  episodes: 2
  frequency: 5
  render_mode: null

checkpoint:
  enabled: true
  directory: checkpoints
  frequency: 5
  save_best: true

wandb:
  enabled: true
  project: "rl-lunar-lander"
  name: baseline
  tags: ["baseline", "reinforce"]

optimize:
  enabled: true
  n_trials: 50
  direction: "maximize"
  study_name: "lunar-lander-tuning"

agent_config: agents/random.yaml
