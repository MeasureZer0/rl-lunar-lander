[project]
name = "rl-lunar-lander"
version = "0.1.0"
description = "Implementation of reinforcement learning agents for the LunarLander environment."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "box2d>=2.3.10",
  "gymnasium>=1.3.0",
  "matplotlib>=3.10.9",
  "omegaconf>=2.3.0",
  "optuna>=4.9.0",
  "pygame>=2.6.1",
  "pyyaml>=6.0.3",
  "swig>=4.4.1",
  "torch>=2.12.0",
  "tqdm>=4.67.3",
  "wandb>=0.27.2",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
  { index = "pytorch-cu130", marker = "sys_platform != 'darwin'" },
]
torchvision = [
  { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
  { index = "pytorch-cu130", marker = "sys_platform != 'darwin'" },
]

[tool.ruff]

src = ["training", "agents"]

line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "ANN"]
ignore = ["E501"]

dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
# Allow unused imports in __init__.py files.
"__init__.py" = ["F401"]

[dependency-groups]
dev = ["ipykernel>=7.2.0", "pyright>=1.1.408", "ruff>=0.15.5"]

[tool.pyright]
venvPath = "./.venv"
typeCheckingMode = "standard"
exclude = ["**/__pycache__", ".*", "**/.ipynb_checkpoints**"]
include = [""]
pythonPlatform = "All"
pythonVersion = "3.13"
